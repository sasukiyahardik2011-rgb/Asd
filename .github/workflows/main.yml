name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # 1. Checkout
      # --------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------
      # 2. Setup Java
      # --------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------
      # 3. Setup Gradle
      # --------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"


      # --------------------------------
      # 4. Check versions
      # --------------------------------
      - name: Check Java and Gradle
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version


      # --------------------------------
      # 5. Find ZIP
      # --------------------------------
      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            ! -path "*/.git/*" \
            | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # --------------------------------
      # 6. Extract ZIP
      # --------------------------------
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/project"
          mkdir -p "$RUNNER_TEMP/project"

          unzip -o "$ZIP_FILE" \
            -d "$RUNNER_TEMP/project"

          echo "ZIP extracted successfully."

          echo ""
          echo "Project files:"
          find "$RUNNER_TEMP/project" \
            -maxdepth 5 \
            -type f \
            | head -200


      # --------------------------------
      # 7. Find Android project
      # --------------------------------
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          ROOT="$RUNNER_TEMP/project"
          PROJECT_DIR=""

          echo "Searching for settings.gradle.kts..."

          FILE=$(find "$ROOT" \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1 || true)

          if [ -n "$FILE" ]; then
            PROJECT_DIR=$(dirname "$FILE")
          fi


          if [ -z "$PROJECT_DIR" ]; then

            echo "Searching for settings.gradle..."

            FILE=$(find "$ROOT" \
              -type f \
              -name "settings.gradle" \
              | head -n 1 || true)

            if [ -n "$FILE" ]; then
              PROJECT_DIR=$(dirname "$FILE")
            fi

          fi


         
