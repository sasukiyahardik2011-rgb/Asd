name: HILIM CHILIM - Build APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ==================================================
      # 2. Setup Java 17
      #
      # cache:none is intentional.
      # This prevents setup-java from searching Gradle
      # files before the ZIP has been extracted.
      # ==================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: none

      # ==================================================
      # 3. Find ZIP
      # ==================================================
      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          echo "Searching repository for ZIP..."

          ZIP_FILE="$(find . \
            -type f \
            -iname '*.zip' \
            -not -path './.git/*' \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ==================================================
      # 4. Extract ZIP
      # ==================================================
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting ZIP..."

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extraction completed."

      # ==================================================
      # 5. Find Android project
      # ==================================================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          PROJECT_DIR=""

          # First preference: Kotlin Gradle settings
          SETTINGS_KTS="$(find extracted \
            -type f \
            -name 'settings.gradle.kts' \
            | head -n 1)"

          if [ -n "$SETTINGS_KTS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_KTS")"
          fi

          # Second preference: Groovy Gradle settings
          if [ -z "$PROJECT_DIR" ]; then
            SETTINGS_GRADLE="$(find extracted \
              -type f \
              -name 'settings.gradle' \
              | head -n 1)"

            if [ -n "$SETTINGS_GRADLE" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS_GRADLE")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."

            echo ""
            echo "Files inside extracted ZIP:"
            find extracted -maxdepth 6 -type f | sort

            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==================================================
      # 6. Verify project
      # ==================================================
      - name: Verify project structure
        shell: bash
        run: |
