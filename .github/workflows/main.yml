name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Find ZIP
      # ==========================================
      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          while IFS= read -r file; do
            ZIP_FILE="$file"
            break
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -not -path "*/.git/*" \
              -print
          )

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP FOUND:"
            echo "$ZIP_FILE"
            echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          else
            echo "No ZIP found."
            echo "ZIP_FILE=" >> "$GITHUB_ENV"
          fi


      # ==========================================
      # 4. Prepare Project
      # ==========================================
      - name: Prepare Android Project
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/android-project"
          mkdir -p "$RUNNER_TEMP/android-project"

          if [ -n "${ZIP_FILE:-}" ]; then
            echo "Extracting ZIP..."
            unzip -q -o "$ZIP_FILE" \
              -d "$RUNNER_TEMP/android-project"
          else
            echo "Copying repository..."
            cp -a "$GITHUB_WORKSPACE/." \
              "$RUNNER_TEMP/android-project/"
          fi


      # ==========================================
      # 5. Find Android Project
      # ==========================================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          ROOT="$RUNNER_TEMP/android-project"
          PROJECT_DIR=""

          echo "Searching for Android project..."

          while IFS= read -r file; do
            PROJECT_DIR="$(dirname "$file")"
            break
          done < <(
            find "$ROOT" \
              -type f \
              -name "settings.gradle.kts" \
              -not -path "*/.git/*" \
              -print
          )

          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r file; do
              PROJECT_DIR="$(dirname "$file")"
              break
            done < <(
              find "$ROOT" \
                -type f \
                -name "settings.gradle" \
                -not -path "*/.git/*" \
                -print
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r file; do
              PROJECT_DIR="$(dirname "$file")"
              break
            done < <(
              find "$ROOT" \
                -type f \
                -name "build.gradle.kts" \
                -not -path "*/.git/*" \
                -print
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r file; do
              PROJECT_DIR="$(dirname "$file")"
              break
            done < <(
              find "$ROOT" \
                -type f \
                -name "build.gradle" \
                -not -path "*/.git/*" \
                -print
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 6. Show Project Structure
      # ==========================================
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "PROJECT"
          echo "================================"

          pwd

          echo ""
          echo "FILES:"

          find . \
            -maxdepth 3 \
            -type f \
            -print \
            | sort \
            | head -200

          echo ""
          echo "GRADLE FILES:"

          find . \
            -type f \
            \
              -name "gradle-wrapper.properties" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \
            -print


      # ==========================================
      # 7. Detect Gradle Wrapper
      # ==========================================
      - name: Detect Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Gradle wrapper configuration found."

            echo ""
            echo "Wrapper configuration:"
            cat gradle/wrapper/gradle-wrapper.properties

            echo ""
            echo "GRADLE_WRAPPER_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "No Gradle wrapper found."
            echo "GRADLE_WRAPPER_EXISTS=false" >> "$GITHUB_ENV"
          fi


      # ==========================================
      # 8. Detect AGP Version
      # ==========================================
      - name: Detect Android Gradle Plugin
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          AGP_VERSION=""

          if [ -f "build.gradle.kts" ]; then
            AGP_VERSION=$(
              grep -oE \
              'com\.android\.application["'\'']?[[:space:]]*(version[[:space:]]*)?["'\'']?[0-9]+\.[0-9]+\.[0-9]+' \
              build.gradle.kts \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
              | head -n 1 || true
            )
          fi

          if [ -z "$AGP_VERSION" ] && [ -f "build.gradle" ]; then
            AGP_VERSION=$(
              grep -oE \
              'com\.android\.application["'\'']?[[:space:]]*(version[[:space:]]*)?["'\'']?[0-9]+\.[0-9]+\.[0-9]+' \
              build.gradle \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
              | head -n 1 || true
            )
          fi

          echo "Detected AGP version: ${AGP_VERSION:-unknown}"

          echo "AGP_VERSION=$AGP_VERSION" >> "$GITHUB_ENV"


      # ==========================================
      # 9. Select Gradle
      # ==========================================
      - name: Select Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "Using project's Gradle wrapper."

            chmod +x ./gradlew

            echo ""
            echo "Gradle version from project:"
            ./gradlew --version

          else

            echo "No wrapper found."

            if [[ "${AGP_VERSION:-}" == 9.4.* ]]; then
              GRADLE_VERSION="9.6.0"

            elif [[ "${AGP_VERSION:-}" == 9.3.* ]]; then
              GRADLE_VERSION="9.5.0"

            elif [[ "${AGP_VERSION:-}" == 9.2.* ]]; then
              GRADLE_VERSION="9.4.1"

            elif [[ "${AGP_VERSION:-}" == 9.1.* ]]; then
              GRADLE_VERSION="9.3.1"

            elif [[ "${AGP_VERSION:-}" == 9.0.* ]]; then
              GRADLE_VERSION="9.1.0"

            elif [[ "${AGP_VERSION:-}" == 8.13.* ]]; then
              GRADLE_VERSION="8.13"

            elif [[ "${AGP_VERSION:-}" == 8.12.* ]]; then
              GRADLE_VERSION="8.13"

            elif [[ "${AGP_VERSION:-}" == 8.11.* ]]; then
              GRADLE_VERSION="8.13"

            else
              GRADLE_VERSION="8.13"
            fi

            echo "Selected Gradle: $GRADLE_VERSION"

            echo "GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"

          fi


      # ==========================================
      # 10. Setup Gradle
      # ==========================================
      - name: Setup Gradle
        if: env.GRADLE_WRAPPER_EXISTS != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ==========================================
      # 11. Create Wrapper If Needed
      # ==========================================
      - name: Create Gradle Wrapper
        if: env.GRADLE_WRAPPER_EXISTS != 'true'
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION"

          chmod +x ./gradlew

          echo "Gradle wrapper created."


      # ==========================================
      # 12. Check Gradle
      # ==========================================
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew --version


      # ==========================================
      # 13. Create Debug Keystore
      # ==========================================
      - name: Create Debug Keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore "$HOME/.
