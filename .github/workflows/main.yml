name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v6

      # --------------------------------------------------
      # 2. Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --------------------------------------------------
      # 3. Setup Gradle 9.3.1
      # --------------------------------------------------
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      # --------------------------------------------------
      # 4. Show versions
      # --------------------------------------------------
      - name: Check Java and Gradle
        run: |
          echo "Java version:"
          java -version

          echo ""
          echo "Gradle version:"
          gradle --version

      # --------------------------------------------------
      # 5. Find ZIP file
      # --------------------------------------------------
      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -iname '*.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP file found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 6. Extract ZIP
      # --------------------------------------------------
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/extracted"
          mkdir -p "$RUNNER_TEMP/extracted"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/extracted"

          echo "ZIP extracted successfully."

          echo ""
          echo "Extracted files:"
          find "$RUNNER_TEMP/extracted" -maxdepth 4 -type f | sort | head -200

      # --------------------------------------------------
      # 7. Find Android / Gradle project
      # --------------------------------------------------
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          ROOT="$RUNNER_TEMP/extracted"
          PROJECT_DIR=""

          echo "Searching for Gradle project..."

          # First preference: settings.gradle.kts
          while IFS= read -r file; do
            PROJECT_DIR="$(dirname "$file")"
            break
          done < <(
            find "$ROOT" \
              -type f \
              -name 'settings.gradle.kts' \
              -print
          )

          # Second preference: settings.gradle
          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r file; do
              PROJECT_DIR="$(dirname "$file")"
              break
            done < <(
              find "$ROOT" \
                -type f \
                -name 'settings.gradle' \
                -print
            )
          fi

          # Fallback: build.gradle.kts
          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r file; do
              PROJECT_DIR="$(dirname "$file")"
              break
            done < <(
              find "$ROOT" \
                -type f \
                -name 'build.gradle.kts' \
                -print
            )
          fi

          # Fallback: build.gradle
          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r file; do
              PROJECT_DIR="$(dirname "$file")"
              break
            done < <(
              find "$ROOT" \
                -type f \
                -name 'build.gradle' \
                -print
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android/Gradle project could not be found."
            echo ""
            echo "Available project files:"
            find "$ROOT" \
              -type f \
              \( \
                -name 'settings.gradle.kts' \
                -o -name 'settings.gradle' \
                -o -name 'build.gradle.kts' \
                -o -name 'build.gradle' \
              \) \
              -print

            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 8. Verify project structure
      # --------------------------------------------------
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "App module:"
          if [ -d "app" ]; then
            ls -la app
          else
            echo "WARNING: app directory not found."
          fi

          echo ""
          echo "Gradle files:"
          find . \
            -maxdepth 4 \
            -type f \
            \( \
              -name '*.gradle' \
              -o -name '*.gradle.kts' \
              -o -name 'gradle-wrapper.properties' \
            \) \
            -print | sort

      # --------------------------------------------------
      # 9. Prepare Gradle Wrapper if missing
      # --------------------------------------------------
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking Gradle wrapper..."

          if [ -f "gradlew" ]; then
            echo "gradlew found."

            chmod +x gradlew

          else
            echo "gradlew not found."
            echo "Creating Gradle wrapper using Gradle 9.3.1..."

            gradle wrapper --gradle-version 9.3.1

            chmod +x gradlew
          fi

          echo ""
          echo "Wrapper files:"
          ls -la gradlew gradle/wrapper/gradle-wrapper.properties

      # --------------------------------------------------
      # 10. Check Gradle version
      # --------------------------------------------------
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew --version

      # --------------------------------------------------
      # 11. Create debug keystore
      # --------------------------------------------------
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          else
            echo "Debug keystore already exists."
          fi

      # --------------------------------------------------
      # 12. Clean project
      # --------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew clean --no-daemon --stacktrace

      # --------------------------------------------------
      # 13. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # --------------------------------------------------
      # 14. Find APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK_FILE="$(find . \
            -type f \
            -path '*/build/outputs/apk/*.apk' \
            -print \
            | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Searching all APK files:"
            find . -type f -name '*.apk' -print

            exit 1
          fi

          APK_PATH="$PROJECT_DIR/${APK_FILE#./}"

          echo "APK found:"
          echo "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 15. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file does not exist."
            exit 1
          fi

          echo "APK verification successful."

          echo ""
          echo "APK:"
          ls -lh "$APK_PATH"

          echo ""
          echo "APK SHA256:"
          sha256sum "$APK_PATH"

      # --------------------------------------------------
      # 16. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: HILIM-CHILIM-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 17. Build Summary
      # --------------------------------------------------
      - name: Build Summary
        shell: bash
        run: |
          echo "## HILIM CHILIM APK Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Build completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📦 APK: HILIM-CHILIM-APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📁 APK path: $APK_PATH" >> "$GITHUB_STEP_SUMMARY"
