name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================
      # 3. Find ZIP file
      # ==========================================
      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE=""

          while IFS= read -r file; do
            ZIP_FILE="$file"
            break
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              ! -path "$GITHUB_WORKSPACE/.git/*"
          )

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP FOUND:"
            echo "$ZIP_FILE"
            echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          else
            echo "No ZIP file found."
            echo "Using repository files directly."
            echo "ZIP_FILE=" >> "$GITHUB_ENV"
          fi


      # ==========================================
      # 4. Extract ZIP / Prepare Project
      # ==========================================
      - name: Prepare Android Project
        shell: bash
        run: |
          set -e

          ROOT="$RUNNER_TEMP/android-project"

          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          if [ -n "${ZIP_FILE:-}" ]; then

            echo "Extracting ZIP..."
            unzip -o "$ZIP_FILE" -d "$ROOT"

          else

            echo "No ZIP found."
            echo "Copying repository..."

            cp -R "$GITHUB_WORKSPACE/." "$ROOT/"

          fi

          echo ""
          echo "Prepared project:"
          find "$ROOT" -type f | head -200


      # ==========================================
      # 5. Find Android Project
      # ==========================================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          ROOT="$RUNNER_TEMP/android-project"
          PROJECT_DIR=""

          echo "Searching for Android project..."

          # ------------------------------------------
          # First: settings.gradle.kts
          # ------------------------------------------
          FILE=""

          while IFS= read -r file; do
            FILE="$file"
            break
          done < <(
            find "$ROOT" \
              -type f \
              -name "settings.gradle.kts"
          )

          if [ -n "$FILE" ]; then
            PROJECT_DIR="$(dirname "$FILE")"
          fi


          # ------------------------------------------
          # Second: settings.gradle
          # ------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            FILE=""

            while IFS= read -r file; do
              FILE="$file"
              break
            done < <(
              find "$ROOT" \
                -type f \
                -name "settings.gradle"
            )

            if [ -n "$FILE" ]; then
              PROJECT_DIR="$(dirname "$FILE")"
            fi

          fi


          # ------------------------------------------
          # Third: build.gradle.kts
          # ------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            FILE=""

            while IFS= read -r file; do
              FILE="$file"
              break
            done < <(
              find "$ROOT" \
                -type f \
                -name "build.gradle.kts"
            )

            if [ -n "$FILE" ]; then
              PROJECT_DIR="$(dirname "$FILE")"
            fi

          fi


          # ------------------------------------------
          # Fourth: build.gradle
          # ------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            FILE=""

            while IFS= read -r file; do
              FILE="$file"
              break
            done < <(
              find "$ROOT" \
                -type f \
                -name "build.gradle"
            )

            if [ -n "$FILE" ]; then
              PROJECT_DIR="$(dirname "$FILE")"
            fi

          fi


          # ------------------------------------------
          # Project not found
          # ------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "=========================================="
            echo "ERROR: Android project not found"
            echo "=========================================="

            echo ""
            echo "Available Gradle files:"

            find "$ROOT" \
              -type f \
              \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
                -o -name "build.gradle" \
                -o -name "build.gradle.kts" \
              \
              -print

            exit 1
          fi


          echo ""
          echo "=========================================="
          echo "ANDROID PROJECT FOUND"
          echo "=========================================="

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 6. Verify Project
      # ==========================================
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "PROJECT DIRECTORY"
          echo "=========================================="

          pwd

          echo ""
          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          ls -la

          echo ""
          echo "=========================================="
          echo "APP DIRECTORY"
          echo "=========================================="

          if [ -d "app" ]; then
            ls -la app
          else
            echo "WARNING: app folder not found."
          fi


      # ==========================================
      # 7. Prepare Gradle Wrapper
      # ==========================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then

            echo "Gradle Wrapper found."

          else

            echo "Gradle Wrapper not found."
            echo "Installing Gradle temporarily..."

            GRADLE_VERSION="8.13"

            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -O "$RUNNER_TEMP/gradle.zip"

            mkdir -p "$RUNNER_TEMP/gradle"

            unzip -q \
              "$RUNNER_TEMP/gradle.zip" \
              -d "$RUNNER_TEMP/gradle"

            export PATH="$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin:$PATH"

            gradle --version

            gradle wrapper \
              --gradle-version "$GRADLE_VERSION"

          fi

          chmod +x ./gradlew

          echo ""
          echo "Gradle Wrapper ready."


     
