          # settings.gradle.kts
          # ------------------------------------------
          FILE=""

          while IFS= read -r file; do
            FILE="$file"
            break
          done < <(
            find "$ROOT" \
              -type f \
              -name "settings.gradle.kts"
          )

          if [ -n "$FILE" ]; then
            PROJECT_DIR="$(dirname "$FILE")"
          fi


