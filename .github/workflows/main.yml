name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Find ZIP file
      # --------------------------------------------------
      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          echo "Repository files:"
          find . -maxdepth 3 -type f | sort | head -300

          ZIP_FILE=""

          while IFS= read -r file; do
            case "$file" in
              *.zip)
                ZIP_FILE="$file"
                break
                ;;
            esac
          done < <(find . -type f -name "*.zip" -not -path "./.git/*" | sort)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"
            echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          else
            echo "No ZIP file found."
          fi

      # --------------------------------------------------
      # 4. Extract ZIP
      # --------------------------------------------------
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          if [ -n "${ZIP_FILE:-}" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d extracted
          else
            echo "No ZIP supplied. Using repository directly."
            cp -a . extracted/
            rm -rf extracted/.git
          fi

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort | head -500

      # --------------------------------------------------
      # 5. Find Android project
      # --------------------------------------------------
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # First priority: folder containing settings.gradle(.kts)
          while IFS= read -r settings_file; do
            PROJECT_DIR="$(dirname "$settings_file")"
            break
          done < <(
            find extracted \
              -type f \
              -name "settings.gradle" -o -name "settings.gradle.kts" \
              -not -path "*/.gradle/*" \
              | sort
          )

          # Second priority: folder containing build.gradle(.kts)
          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r build_file; do
              PROJECT_DIR="$(dirname "$build_file")"
              break
            done < <(
              find extracted \
                -type f \
                -name "build.gradle" -o -name "build.gradle.kts" \
                -not -path "*/.gradle/*" \
                | sort
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project could not be found."
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 6. Verify project structure
      # --------------------------------------------------
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo
          echo "Project files:"
          find . -maxdepth 3 -type f | sort | head -500

          echo
          echo "Checking Gradle files..."

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "OK: settings.gradle found"
          else
            echo "WARNING: settings.gradle not found"
          fi

          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "OK: root build.gradle found"
          else
            echo "WARNING: root build.gradle not found
