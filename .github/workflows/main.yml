name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Find ZIP file
      # ==========================================
      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR ZIP FILE"
          echo "=========================================="

          ZIP_FILE=""

          while IFS= read -r file; do
            ZIP_FILE="$file"
            break
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              ! -path "$GITHUB_WORKSPACE/.git/*"
          )

          if [ -n "$ZIP_FILE" ]; then
            echo ""
            echo "ZIP FOUND:"
            echo "$ZIP_FILE"

            echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          else
            echo ""
            echo "NO ZIP FILE FOUND."
            echo "Using repository files directly."

            echo "ZIP_FILE=" >> "$GITHUB_ENV"
          fi


      # ==========================================
      # 4. Prepare Android Project
      # ==========================================
      - name: Prepare Android Project
        shell: bash
        run: |
          set -e

          ROOT="$RUNNER_TEMP/android-project"

          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          echo "=========================================="
          echo "PREPARING PROJECT"
          echo "=========================================="

          if [ -n "${ZIP_FILE:-}" ]; then

            echo "Extracting ZIP..."

            unzip -o "$ZIP_FILE" \
              -d "$ROOT"

          else

            echo "Copying repository..."

            cp -R "$GITHUB_WORKSPACE/." "$ROOT/"

          fi

          echo ""
          echo "PROJECT FILES:"

          find "$ROOT" -type f | head -200


      # ==========================================
      # 5. Find Android Project
      # ==========================================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          ROOT="$RUNNER_TEMP/android-project"
          PROJECT_DIR=""

          echo "=========================================="
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "=========================================="


