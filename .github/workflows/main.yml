name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Setup Gradle
      # ==========================================
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"


      # ==========================================
      # 4. Check Java & Gradle
      # ==========================================
      - name: Check Java and Gradle
        run: |
          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== GRADLE ====="
          gradle --version


      # ==========================================
      # 5. Find ZIP
      # ==========================================
      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            ! -path "*/.git/*" \
            | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            echo "Continuing with repository files..."
            echo "ZIP_FILE=" >> "$GITHUB_ENV"
          else
            echo "ZIP FOUND:"
            echo "$ZIP_FILE"
            echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          fi


      # ==========================================
      # 6. Extract ZIP
      # ==========================================
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/project"
          mkdir -p "$RUNNER_TEMP/project"

          if [ -n "${ZIP_FILE:-}" ]; then

            echo "Extracting ZIP..."

            unzip -o "$ZIP_FILE" \
              -d "$RUNNER_TEMP/project"

          else

            echo "No ZIP found."
            echo "Copying repository..."

            cp -r "$GITHUB_WORKSPACE/." \
              "$RUNNER_TEMP/project/"

          fi

          echo ""
          echo "Project files:"
          find "$RUNNER_TEMP/project" \
            -maxdepth 5 \
            -type f \
            | head -200


      # ==========================================
      # 7. Find Android Project
      # ==========================================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          ROOT="$RUNNER_TEMP/project"
          PROJECT_DIR=""

          echo "Searching for Android project..."

          # settings.gradle.kts
          FILE=$(find "$ROOT" \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1 || true)

          if [ -n "$FILE" ]; then
            PROJECT_DIR=$(dirname "$FILE")
          fi


          # settings.gradle
          if [ -z "$PROJECT_DIR" ]; then

            FILE=$(find "$ROOT" \
              -type f \
              -name "settings.gradle" \
              | head -n 1 || true)

            if [ -n "$FILE" ]; then
              PROJECT_DIR=$(dirname "$FILE")
            fi

          fi


          # build.gradle.kts
          if [ -z "$PROJECT_DIR" ]; then

            FILE=$(find "$ROOT" \
              -type f \
              -name "build.gradle.kts" \
              | head -n 1 || true)

            if [ -n "$FILE" ]; then
              PROJECT_DIR=$(dirname "$FILE")
            fi

          fi


          # build.gradle
          if [ -z "$PROJECT_DIR" ]; then

            FILE=$(find "$ROOT" \
              -type f \
              -name "build.gradle" \
              | head -n 1 || true)

            if [ -n "$FILE" ]; then
              PROJECT_DIR=$(dirname "$FILE")
            fi

          fi


          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: Android project not found."

            echo ""
            echo "Available Gradle files:"

            find "$ROOT" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o -name "settings.gradle" \
                -o -name "build.gradle.kts" \
                -o -name "build.gradle" \
              \) \
              -print

            exit 1

          fi


          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 8. Verify Project
      # ==========================================
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "App folder:"

          if [ -d "app" ]; then
            ls -la app
          else
            echo "WARNING: app folder not found."
          fi


      # ==========================================
      # 9. Prepare Gradle Wrapper
      # ==========================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then

            echo "Gradle wrapper found."

          else

            echo "Gradle wrapper not found."
            echo "Creating wrapper..."

            gradle wrapper \
              --gradle-version 9.3.1

          fi

          chmod +x ./gradlew

          echo "Gradle wrapper ready."


      # ==========================================
      # 10. Check Gradle Wrapper
      # ==========================================
      - name: Check Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew --version


      # ==========================================
      # 11. Create Debug Keystore
      # ==========================================
      - name: Create Debug Keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          echo "Debug keystore ready."


      # ==========================================
      # 12. Clean
      # ==========================================
      - name: Clean Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 13. Build APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 14. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            ! -path "*/.gradle/*" \
            | head -n 1 || true)

          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK was not generated."

            echo ""
            echo "All APK files:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1

          fi

          echo ""
          echo "================================"
          echo "APK FOUND"
          echo "================================"

          echo "$APK_FILE"

          echo ""
          ls -lh "$APK_FILE"

          echo "APK_PATH=$APK_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 15. Verify APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          if [ ! -f "$APK_PATH" ]; then
            echo "APK file does not exist."
            exit 1
          fi

          echo "APK verification successful."

          echo ""
          echo "APK size:"
          ls -lh "$APK_PATH"

          echo ""
          echo "SHA256:"
          sha256sum "$APK_PATH"


      # ==========================================
      # 16. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HILIM-CHILIM-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30


      # ==========================================
      # 17. Build Summary
      # ==========================================
      - name: Build Summary
        shell: bash
        run: |
          echo "## ✅ HILIM CHILIM APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### APK Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📦 Artifact: **HILIM-CHILIM-APK**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📱 Download the APK from the Artifacts section." >> "$GITHUB_STEP_SUMMARY"
