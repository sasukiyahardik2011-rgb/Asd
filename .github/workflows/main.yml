name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Android SDK
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Find ZIP
      - name: Find ZIP file
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -name "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            echo "Repository files:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # 6. Extract ZIP
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d extracted

          echo "ZIP extracted successfully."

          echo "Extracted project:"
          ls -la extracted

      # 7. Use extracted Android project
      - name: Find Android Project
        id: android_project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="extracted"

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo ""
            echo "Files inside extracted:"
            find "$PROJECT_DIR" -maxdepth 3 -type f
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app module not found."
            exit 1
          fi

          echo "Android project found successfully."

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 8. Verify project structure
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.android_project.outputs.project_dir }}"

          echo "======================================"
          echo "PROJECT STRUCTURE"
          echo "======================================"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Root files:"
          ls -la "$PROJECT_DIR"

          echo ""
          echo "App module:"
          ls -la "$PROJECT_DIR/app"

          echo ""
          echo "Gradle files:"
          ls -la "$PROJECT_DIR/gradle"

          echo ""
          echo "Project verification successful."

      # 9. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 10. Prepare Gradle Wrapper
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.android_project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          echo "Checking Gradle wrapper..."

          if [ ! -f "gradlew" ]; then
            echo "gradlew not found."
            echo "Creating Gradle wrapper..."

            gradle wrapper --gradle-version 8.7

            chmod +x gradlew
          else
            echo "gradlew found."
            chmod +x gradlew
          fi

          if [ ! -f "gradlew" ]; then
            echo "ERROR: Gradle wrapper could not be created."
            exit 1
          fi

          echo "Gradle wrapper is ready."

      # 11. Check Gradle
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.android_project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew --version

      # 12. Create Debug Keystore
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"

          if [ ! -f "$DEBUG_KEYSTORE" ]; then

            echo "Creating debug keystore..."

            keytool -genkeypair \
              -v \
              -keystore "$DEBUG_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          else

            echo "Debug keystore already exists."

          fi

      # 13. Clean Project
      - name: Clean project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.android_project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew clean --no-daemon

      # 14. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.android_project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 15. Find APK
      - name: Find APK
        id: find_apk
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.android_project.outputs.project_dir }}"

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not created."

            echo ""
            echo "Searching for APK:"
            find "$PROJECT_DIR" -type f -name "*.apk"

            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      # 16. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="${{ steps.find_apk.outputs.apk_file }}"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file does not exist."
            exit 1
          fi

          echo "======================================"
          echo "APK VERIFIED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

      # 17. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HILIM-CHILIM-APK
          path: ${{ steps.find_apk.outputs.apk_file }}
          if-no-files-found: error
          retention-days: 30

      # 18. Final Success
      - name: Build Summary
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo " HILIM CHILIM APK BUILD SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "APK Artifact:"
          echo "HILIM-CHILIM-APK"
          echo ""
          echo "BUILD COMPLETED SUCCESSFULLY"
          echo "======================================"
