name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. CHECK JAVA
      # ==========================================
      - name: Check Java
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "JAVA VERSION"
          echo "=============================="

          java -version


      # ==========================================
      # 4. FIND ZIP
      # ==========================================
      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              ! -path "*/.git/*" \
              -print \
              | head -n 1
          )"

          if [ -n "$ZIP_FILE" ]; then

            echo "ZIP FOUND:"
            echo "$ZIP_FILE"

            echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          else

            echo "No ZIP file found."
            echo "Repository files will be used."

            echo "ZIP_FILE=" >> "$GITHUB_ENV"

          fi


      # ==========================================
      # 5. PREPARE PROJECT
      # ==========================================
      - name: Prepare Android Project
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/android-project"

          mkdir -p "$RUNNER_TEMP/android-project"

          if [ -n "${ZIP_FILE:-}" ]; then

            echo "=============================="
            echo "EXTRACTING ZIP"
            echo "=============================="

            unzip -o "$ZIP_FILE" \
              -d "$RUNNER_TEMP/android-project"

          else

            echo "=============================="
            echo "USING REPOSITORY"
            echo "=============================="

            cp -a "$GITHUB_WORKSPACE/." \
              "$RUNNER_TEMP/android-project/"

          fi

          echo ""
          echo "Project files:"
          find "$RUNNER_TEMP/android-project" \
            -maxdepth 5 \
            -type f \
            -print \
            | sort \
            | head -300


      # ==========================================
      # 6. FIND ANDROID PROJECT
      # ==========================================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          ROOT="$RUNNER_TEMP/android-project"

          PROJECT_DIR=""

          echo "=============================="
          echo "SEARCHING ANDROID PROJECT"
          echo "=============================="


          # ----------------------------------------
          # settings.gradle.kts
          # ----------------------------------------
          FILE="$(
            find "$ROOT" \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              | head -n 1
          )"

          if [ -n "$FILE" ]; then
            PROJECT_DIR="$(dirname "$FILE")"
          fi


          # ----------------------------------------
          # settings.gradle
          # ----------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            FILE="$(
              find "$ROOT" \
                -type f \
                -name "settings.gradle" \
                -print \
                | head -n 1
            )"

            if [ -n "$FILE" ]; then
              PROJECT_DIR="$(dirname "$FILE")"
            fi

          fi


          # ----------------------------------------
          # build.gradle.kts
          # ----------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            FILE="$(
              find "$ROOT" \
                -type f \
                -name "build.gradle.kts" \
                -print \
                | head -n 1
            )"

            if [ -n "$FILE" ]; then
              PROJECT_DIR="$(dirname "$FILE")"
            fi

          fi


          # ----------------------------------------
          # build.gradle
          # ----------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            FILE="$(
              find "$ROOT" \
                -type f \
                -name "build.gradle" \
                -print \
                | head -n 1
            )"

            if [ -n "$FILE" ]; then
              PROJECT_DIR="$(dirname "$FILE")"
            fi

          fi


          # ----------------------------------------
          # PROJECT NOT FOUND
          # ----------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "ERROR: Android/Gradle project not found."

            echo ""
            echo "Available Gradle files:"

            find "$ROOT" \
              -maxdepth 8 \
              -type f \
              \
                -name "settings.gradle.kts" \
                -o -name "settings.gradle" \
                -o -name "build.gradle.kts" \
                -o -name "build.gradle" \
              \
              -print \
              | sort

            exit 1

          fi


          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 7. VERIFY PROJECT STRUCTURE
      # ==========================================
      - name:
