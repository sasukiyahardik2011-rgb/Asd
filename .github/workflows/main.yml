name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Java 17
      # IMPORTANT: Gradle cache અહીં રાખવાનું નથી.
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install required Android SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Find ZIP
      - name: Find ZIP file
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          while IFS= read -r file; do
            case "$file" in
              *.zip)
                ZIP_FILE="$file"
                break
                ;;
            esac
          done < <(find . -type f -name "*.zip" -not -path "./.git/*")

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            echo "Files in repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # 6. Extract ZIP
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d extracted

          echo "ZIP extracted successfully."
          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | sort | head -300

      # 7. Find Android Project
      - name: Find Android Project
        id: android_project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # First preference: Gradle settings file
          SETTINGS_FILE=$(find extracted -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -not -path "*/.gradle/*" \
            | head -n 1 || true)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          else
            # Fallback: locate root build file with an app module
            BUILD_FILE=$(find extracted -type f \
              -name "build.gradle" -o -name "build.gradle.kts" \
              -not -path "*/app/build.gradle" \
              -not -path "*/app/build.gradle.kts" \
              -not -path "*/.gradle/*" \
              | head -n 1 || true)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR="$(dirname "$BUILD_FILE")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project could not be found."
            echo "Searching for Gradle files..."
            find extracted -type f \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradle-wrapper.properties" \
              | sort
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 8. Verify project structure
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.android_project.outputs.project_dir }}"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          ls -la

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ] && \
             [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: Gradle project files are missing."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app module not found."
            exit 1
          fi

          echo ""
          echo "App module:"
          ls -la app

          echo ""
          echo "Project structure verified successfully."

      # 9. Setup Gradle AFTER ZIP extraction
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 10. Create Gradle wrapper if missing
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.android_project.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          echo "Checking Gradle wrapper..."

          if [ ! -f "./gradlew" ]; then
            echo "gradlew is missing."
            echo "Creating Gradle wrapper..."

            gradle wrapper --gradle-version 8.7

            chmod +x gradlew
          else
            echo "gradlew already exists."
            chmod +x gradlew
          fi

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: Gradle wrapper could not be created."
            exit 1
          fi

          echo "Gradle wrapper ready."

      # 11. Check Gradle
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.android_project.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew --version

      # 12. Create debug keystore if required
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          DEBUG_DIR="$HOME/.android"
          DEBUG_KEYSTORE="$DEBUG_DIR/debug.keystore"

          mkdir -p "$DEBUG_DIR"

          if [ ! -f "$DEBUG_KEYSTORE" ]; then
