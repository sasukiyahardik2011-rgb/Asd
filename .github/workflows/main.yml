name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout source code
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # 3. FIND ZIP
      # ==================================================

      - name: Find ZIP file
        shell: bash
        run: |

          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            ! -path "*/.git/*" \
            | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then

            echo "ZIP FOUND:"
            echo "$ZIP_FILE"

            echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          else

            echo "No ZIP file found."
            echo "Repository itself will be used."

            echo "ZIP_FILE=" >> "$GITHUB_ENV"

          fi


      # ==================================================
      # 4. EXTRACT ZIP
      # ==================================================

      - name: Extract ZIP
        shell: bash
        run: |

          set -e

          rm -rf "$RUNNER_TEMP/android-project"

          mkdir -p "$RUNNER_TEMP/android-project"

          if [ -n "${ZIP_FILE:-}" ]; then

            echo "Extracting ZIP..."

            unzip -o "$ZIP_FILE" \
              -d "$RUNNER_TEMP/android-project"

            echo "ZIP extraction completed."

          else

            echo "Copying repository files..."

            cp -a "$GITHUB_WORKSPACE/." \
              "$RUNNER_TEMP/android-project/"

          fi

          echo ""
          echo "Files inside project:"

          find "$RUNNER_TEMP/android-project" \
            -maxdepth 5 \
            -type f \
            | head -300


      # ==================================================
      # 5. FIND ANDROID PROJECT
      # ==================================================

      - name: Find Android Project
        shell: bash
        run: |

          set -e

          ROOT="$RUNNER_TEMP/android-project"

          PROJECT_DIR=""

          echo "Searching for Android Gradle project..."

          # ----------------------------------------------
          # settings.gradle.kts
          # ----------------------------------------------

          SETTINGS_KTS=$(find "$ROOT" \
            -type f \
            -name "settings.gradle.kts" \
            ! -path "*/build/*" \
            | head -n 1 || true)

          if [ -n "$SETTINGS_KTS" ]; then

            PROJECT_DIR=$(dirname "$SETTINGS_KTS")

          fi


          # ----------------------------------------------
          # settings.gradle
          # ----------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            SETTINGS_GRADLE=$(find "$ROOT" \
              -type f \
              -name "settings.gradle" \
              ! -path "*/build/*" \
              | head -n 1 || true)

            if [ -n "$SETTINGS_GRADLE" ]; then

              PROJECT_DIR=$(dirname "$SETTINGS_GRADLE")

            fi

          fi


          # ----------------------------------------------
          # build.gradle.kts
          # ----------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            BUILD_KTS=$(find "$ROOT" \
              -type f \
              -name "build.gradle.kts" \
              ! -path "*/build/*" \
              | head -n 1 || true)

            if [ -n "$BUILD_KTS" ]; then

              PROJECT_DIR=$(dirname "$BUILD_KTS")

            fi

          fi


          # ----------------------------------------------
          # build.gradle
          # ----------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            BUILD_GRADLE=$(find "$ROOT" \
              -type f \
              -name "build.gradle" \
              ! -path "*/build/*" \
              | head -n 1 || true)

            if [ -n "$BUILD_GRADLE" ]; then

              PROJECT_DIR=$(dirname "$BUILD_GRADLE")

            fi

          fi


          # ----------------------------------------------
          # ERROR IF NOT FOUND
          # ----------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "======================================"
            echo "ERROR: ANDROID PROJECT NOT FOUND"
            echo "======================================"

            echo ""
            echo "Gradle files found:"

            find "$ROOT" \
              -type f \
              \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
                -o \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \
              -print

            exit 1

          fi


          echo ""
          echo "======================================"
          echo "ANDROID PROJECT FOUND"
          echo "======================================"

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" \
            >> "$GITHUB_ENV"


      # ==================================================
      # 6. SHOW PROJECT
      # ==================================================

      - name: Verify project structure
        shell: bash
        run: |

          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"

          ls -la

          echo ""
          echo "All Gradle files:"

          find . \
            -maxdepth 
