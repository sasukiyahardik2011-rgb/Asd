name: Build HILIM CHILIM APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/PANDA-GAME-SOURCE.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/PANDA-GAME-SOURCE.zip"
          else
            ZIP_FILE=$(find "$GITHUB_WORKSPACE" -type f -iname "*.zip" | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found ZIP: $ZIP_FILE"

      - name: Prepare Android Project
        shell: bash
        run: |
          set -e

          PROJECT_ROOT="$RUNNER_TEMP/android-project"

          rm -rf "$PROJECT_ROOT"
          mkdir -p "$PROJECT_ROOT"

          unzip -q -o "$ZIP_FILE" -d "$PROJECT_ROOT"

          echo "ZIP extracted successfully."

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$RUNNER_TEMP/android-project" -type f -name "settings.gradle.kts" | head -n 1 || true)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find "$RUNNER_TEMP/android-project" -type f -name "settings.gradle" | head -n 1 || true)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts or settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "PROJECT"
          echo "================================"
          pwd

          echo ""
          echo "FILES:"
          ls -la

          echo ""
          echo "Checking required files..."

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle file missing."
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            echo "ERROR: build.gradle file missing."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app folder missing."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle file missing."
            exit 1
          fi

          echo ""
          echo "Project structure OK."

      - name: Detect Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "GRADLE_COMMAND=./gradlew" >> "$GITHUB_ENV"
            echo "Gradle wrapper found."
          else
            echo "GRADLE_COMMAND=gradle" >> "$GITHUB_ENV"
            echo "Gradle wrapper not found."
          fi

      - name: Detect Android Gradle Plugin
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking Android Gradle Plugin..."

          if [ -f "gradle/libs.versions.toml" ]; then
            grep -n "agp" gradle/libs.versions.toml || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
            chmod +x gradlew
            echo "Gradle wrapper created."
          else
            chmod +x gradlew
            echo "Existing Gradle wrapper will be used."
          fi

      - name: Check Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew --version

      - name: Create Debug Keystore
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Debug keystore ready."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Starting Android APK build..."

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | head -n 1 || true)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Searching entire project..."
            find "$PROJECT_DIR" -type f -name "*.apk" || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          echo "APK_PATH=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HILIM-CHILIM-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo "## HILIM CHILIM APK BUILD SUCCESSFUL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "APK artifact: HILIM-CHILIM-APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the APK from the Actions Artifacts section." >> "$GITHUB_STEP_SUMMARY"
