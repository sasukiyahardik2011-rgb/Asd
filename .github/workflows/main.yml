name: HILIM CHILIM - Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HILIM CHILIM APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4


      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # 3. Setup Gradle
      # The ZIP does not contain gradlew, so install Gradle directly.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'


      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # 5. Install Android SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "Android SDK packages installed successfully."


      # 6. Find and extract ZIP
      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP file found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # 7. Extract ZIP
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f -print | sort


      # 8. Find Android Project
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # First check the expected location.
          if [ -f "extracted/settings.gradle.kts" ] &&
             [ -f "extracted/build.gradle.kts" ] &&
             [ -f "extracted/app/build.gradle.kts" ]; then

            PROJECT_DIR="extracted"

          else

            # Search safely for settings.gradle.kts.
            SETTINGS_FILE="$(find extracted -type f -name 'settings.gradle.kts' -print -quit)"

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            fi

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project could not be found."
            echo ""
            echo "Available files:"
            find extracted -maxdepth 5 -type f -print | sort
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # 9. Verify project structure
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo ""
          echo "Checking Android project..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -d app/src/main
          test -f app/src/main/AndroidManifest.xml

          echo ""
          echo "Android project structure is valid."


      # 10. Create debug keystore
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=IN"
          fi

          echo "Debug keystore:"
          ls -lh debug.keystore


      # 11. Check Gradle
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Gradle project tasks:"
          gradle tasks --no-daemon --stacktrace


      # 12. Clean project
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean --no-daemon --stacktrace


      # 13. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # 14. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Searching for generated APK..."

          APK_FILE="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Build output:"
            find app/build/outputs -type f -print 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "APK generated successfully:"
          ls -lh "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"


      # 15. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HILIM-CHILIM-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
